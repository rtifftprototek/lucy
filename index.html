<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lucy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none; /* hide mouse cursor - no touch/mouse interaction expected */
  }

  /*
    Everything is laid out for a 1920x1080 landscape canvas, sized off
    the viewport (vw/vh) rather than fixed pixels. The 5.5" OLED is
    natively portrait; kiosk-display.service rotates the output so this
    page still sees 1920x1080.
  */

  /* Slow burn-in drift: the whole stage moves a few pixels every couple
     of minutes so nothing bright sits on exactly the same OLED pixels
     for hours. Too slow and small to notice. See DRIFT_* in the script. */
  #stage {
    position: absolute;
    inset: 0;
    transition: transform 20s ease-in-out;
  }

  .mode {
    position: absolute;
    inset: 0;
    display: none;
  }
  .mode.active {
    display: block;
  }

  /* ---- Dog mode ----
     Two stacked video players. The next clip loads in the hidden one and
     only becomes visible once it's actually playing, so there's never a
     black flash between clips. */
  #mode-dog video {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    visibility: hidden;
  }
  #mode-dog video.showing {
    visibility: visible;
  }

  /* ---- Digital sign mode ----
     Each slide is a full-screen layer; the active one fades in. */
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .slide.showing {
    opacity: 1;
  }
  .slide video,
  .slide img.full {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }

  /* ---- Clock slide ----
     clock_face.png is 1920x1080 with the dial centered. The hands and
     center cap are square images with the pivot at the image center,
     pointing to 12. --hand-size and --center-size are the sizes of those
     squares; tweak them to make the hands longer/shorter or the cap
     bigger/smaller. (At the designer's original scale both would be
     24.32vw, but the hands looked stubby on this wide dial.) Adjust
     --clock-cx/--clock-cy if the dial's center ever moves. */
  #slide-clock {
    --clock-cx: 50vw;
    --clock-cy: 50vh;
    --hand-size: 32vw;
    --center-size: 24.32vw;
  }
  .hand {
    position: absolute;
    width: var(--hand-size);
    height: var(--hand-size);
    left: calc(var(--clock-cx) - (var(--hand-size) / 2));
    top: calc(var(--clock-cy) - (var(--hand-size) / 2));
    transform-origin: center center;
  }
  #clock-center {
    position: absolute;
    width: var(--center-size);
    height: var(--center-size);
    left: calc(var(--clock-cx) - (var(--center-size) / 2));
    top: calc(var(--clock-cy) - (var(--center-size) / 2));
  }
</style>
</head>
<body>

<div id="stage">

  <div id="mode-dog" class="mode">
    <video id="dog-video-a" muted playsinline preload="auto"></video>
    <video id="dog-video-b" muted playsinline preload="auto"></video>
  </div>

  <div id="mode-sign" class="mode">
    <div id="slide-clock" class="slide">
      <img class="full" src="assets/clock/clock_face.png" alt="">
      <img class="hand" id="hand-hour" src="assets/clock/clock_hand_hour.png" alt="" onerror="this.style.display='none'">
      <img class="hand" id="hand-minute" src="assets/clock/clock_hand_minute.png" alt="" onerror="this.style.display='none'">
      <img class="hand" id="hand-second" src="assets/clock/clock_hand_second.png" alt="" onerror="this.style.display='none'">
      <img id="clock-center" src="assets/clock/clock_center.png" alt="" onerror="this.style.display='none'">
    </div>
    <div id="slide-video" class="slide">
      <video id="sign-video" muted playsinline preload="auto"></video>
    </div>
    <div id="slide-welcome" class="slide">
      <img class="full" id="welcome-still" src="assets/sign/welcome_slide.png" alt="">
      <video id="welcome-video" muted playsinline preload="auto"></video>
    </div>
  </div>

</div>

<script>
(function () {
  // =====================================================================
  // Settings - all easy to retune
  // =====================================================================

  // The button toggles between these, in this order. The first one is
  // what the display boots into.
  const MODES = ['dog', 'sign'];

  // ---- Dog mode ----
  const DOG_CLIPS = {
    sleeping: 'assets/dog/sleeping_loop.mp4',
    wakeUp: 'assets/dog/wake_up.mp4',
    fallAsleep: 'assets/dog/fall_asleep.mp4',
    idle: 'assets/dog/idle_loop.mp4',
    lookAround: 'assets/dog/look_around.mp4',
    perkUp: 'assets/dog/perk_up.mp4',
  };

  // While awake, Lucy plays a random mix of these until the awake time
  // (below) is used up. Higher weight = picked more often. The idle loop
  // always plays at least once per awake period, and the same clip never
  // plays twice in a row.
  const AWAKE_ACTIONS = [
    { clip: 'idle', weight: 2 },
    { clip: 'lookAround', weight: 1 },
    { clip: 'perkUp', weight: 1 },
  ];
  const AWAKE_MIN_MS = 45 * 1000;
  const AWAKE_MAX_MS = 90 * 1000;

  // How long she sleeps before waking up on her own.
  const SLEEP_MIN_MS = 3 * 60 * 1000;
  const SLEEP_MAX_MS = 8 * 60 * 1000;

  // Motion only wakes her once she's been asleep (sleeping loop playing)
  // at least this long, so she can't be bounced straight back awake the
  // moment she dozes off.
  const MIN_SLEEP_BEFORE_MOTION_MS = 10 * 1000;

  // ---- Digital sign mode ----
  // Cycles through these in order, forever. Types:
  //   clock   - the analog clock, shown for `seconds`
  //   welcome - plays the welcome animation once, then holds on the
  //             welcome slide for `seconds`
  //   video   - plays `src` once, then moves on. Skipped automatically
  //             if the file is missing, so slots can be added before
  //             the video exists.
  const SIGN_PLAYLIST = [
    { type: 'clock', seconds: 30 },
    { type: 'video', src: 'assets/sign/prototek_1.mp4' },
    { type: 'welcome', seconds: 20 },
    { type: 'video', src: 'assets/sign/prototek_2.mp4' },
  ];

  // ---- Burn-in drift ----
  const DRIFT_PX = 6;                   // max offset in each direction
  const DRIFT_EVERY_MS = 2 * 60 * 1000;

  // =====================================================================

  const $ = (id) => document.getElementById(id);
  const randBetween = (min, max) => min + Math.random() * (max - min);

  let currentMode = null;
  // Bumped whenever the current sequence is abandoned (mode switch,
  // motion wake). Every pending callback checks it and quietly does
  // nothing if it's stale, so nothing ever needs cancelling one by one.
  let gen = 0;
  let timer = null;

  function clearTimer() {
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function releaseVideo(v) {
    v.onended = null;
    v.onerror = null;
    v.onplaying = null;
    v.pause();
    v.removeAttribute('src');
    v.load(); // frees the decoder
  }

  // =====================================================================
  // Dog mode
  // =====================================================================

  const players = [$('dog-video-a'), $('dog-video-b')];
  let activePlayer = 0;
  let dogState = null;     // 'waking' | 'awake' | 'fallingAsleep' | 'asleep'
  let asleepSince = null;  // when the sleeping loop started, else null

  // Plays one dog clip in the hidden player and swaps it in once it's
  // actually playing. Calls onEnded when it finishes (unless stale).
  function playDogClip(key, myGen, onEnded) {
    if (myGen !== gen) return;
    console.log('[dog] play', key);
    const next = players[1 - activePlayer];
    next.onended = () => { if (myGen === gen) onEnded(); };
    next.onerror = () => {
      // A missing or unplayable file shouldn't freeze Lucy - log it and
      // move on as if the clip had finished.
      console.error('[dog] could not play', DOG_CLIPS[key]);
      setTimeout(() => { if (myGen === gen) onEnded(); }, 1000);
    };
    next.onplaying = () => {
      next.onplaying = null;
      if (myGen !== gen) return;
      const prev = players[activePlayer];
      next.classList.add('showing');
      prev.classList.remove('showing');
      releaseVideo(prev);
      activePlayer = 1 - activePlayer;
    };
    next.src = DOG_CLIPS[key];
    next.play().catch(() => {});
  }

  function wakeUp(myGen) {
    if (myGen !== gen) return;
    console.log('[dog] === waking up ===');
    clearTimer();
    dogState = 'waking';
    asleepSince = null;
    playDogClip('wakeUp', myGen, () => {
      dogState = 'awake';
      const awakeUntil = Date.now() + randBetween(AWAKE_MIN_MS, AWAKE_MAX_MS);
      playAwakeAction(myGen, awakeUntil, null, false);
    });
  }

  function pickAwakeAction(last) {
    const options = AWAKE_ACTIONS.filter(a => a.clip !== last);
    let r = Math.random() * options.reduce((sum, a) => sum + a.weight, 0);
    for (const a of options) {
      r -= a.weight;
      if (r <= 0) return a.clip;
    }
    return options[options.length - 1].clip;
  }

  function playAwakeAction(myGen, awakeUntil, last, idlePlayed) {
    if (myGen !== gen) return;
    if (Date.now() >= awakeUntil && idlePlayed) {
      fallAsleep(myGen);
      return;
    }
    // Out of time but the idle loop hasn't played yet - play it now.
    const clip = Date.now() >= awakeUntil ? 'idle' : pickAwakeAction(last);
    playDogClip(clip, myGen, () => {
      playAwakeAction(myGen, awakeUntil, clip, idlePlayed || clip === 'idle');
    });
  }

  function fallAsleep(myGen) {
    console.log('[dog] === falling asleep ===');
    dogState = 'fallingAsleep';
    playDogClip('fallAsleep', myGen, () => {
      dogState = 'asleep';
      asleepSince = Date.now();
      const sleepMs = randBetween(SLEEP_MIN_MS, SLEEP_MAX_MS);
      console.log('[dog] sleeping for', Math.round(sleepMs / 1000), 's');
      timer = setTimeout(() => wakeUp(myGen), sleepMs);
      loopSleeping(myGen);
    });
  }

  function loopSleeping(myGen) {
    playDogClip('sleeping', myGen, () => loopSleeping(myGen));
  }

  function handleMotion() {
    if (currentMode !== 'dog') {
      console.log('[motion] ignored - not in dog mode');
      return;
    }
    const sleptMs = asleepSince === null ? -1 : Date.now() - asleepSince;
    if (dogState === 'asleep' && sleptMs >= MIN_SLEEP_BEFORE_MOTION_MS) {
      console.log('[motion] waking Lucy');
      gen++;
      wakeUp(gen);
    } else {
      console.log('[motion] ignored - Lucy is', dogState, '(asleep', sleptMs, 'ms)');
    }
  }

  function startDog() {
    // Entering dog mode always starts with Lucy waking up.
    wakeUp(gen);
  }

  function stopDog() {
    players.forEach(v => { v.classList.remove('showing'); releaseVideo(v); });
    dogState = null;
    asleepSince = null;
  }

  // =====================================================================
  // Digital sign mode
  // =====================================================================

  const welcomeVideo = $('welcome-video');
  const signVideo = $('sign-video');
  const welcomeStill = $('welcome-still');

  function showSlide(id) {
    document.querySelectorAll('.slide').forEach(s => {
      s.classList.toggle('showing', s.id === id);
    });
  }

  function playSignItem(index, myGen) {
    if (myGen !== gen) return;
    const item = SIGN_PLAYLIST[index % SIGN_PLAYLIST.length];
    const next = () => playSignItem(index + 1, myGen);
    console.log('[sign] show', item.type);

    if (item.type === 'clock') {
      updateClock();
      showSlide('slide-clock');
      timer = setTimeout(next, item.seconds * 1000);
    } else if (item.type === 'welcome') {
      // The animation ends on exactly the welcome slide image, so hiding
      // the video once it ends leaves the still showing seamlessly.
      const hold = () => {
        if (myGen !== gen) return;
        welcomeStill.style.visibility = 'visible';
        releaseVideo(welcomeVideo);
        welcomeVideo.style.visibility = 'hidden';
        timer = setTimeout(next, item.seconds * 1000);
      };
      // The still stays hidden until the animation has finished, otherwise
      // it flashes up before the animation's first (black) frame.
      welcomeStill.style.visibility = 'hidden';
      welcomeVideo.style.visibility = 'visible';
      welcomeVideo.onended = hold;
      welcomeVideo.onerror = () => {
        console.error('[sign] could not play welcome animation');
        hold();
      };
      welcomeVideo.src = 'assets/sign/welcome_animation.mp4';
      welcomeVideo.play().catch(() => {});
      showSlide('slide-welcome');
    } else if (item.type === 'video') {
      const done = () => {
        if (myGen !== gen) return;
        releaseVideo(signVideo);
        next();
      };
      signVideo.onended = done;
      signVideo.onerror = () => {
        console.log('[sign] skipping', item.src, '(missing or unplayable)');
        done();
      };
      // Only fade the slide in once the video is actually playing, so a
      // missing file is skipped without flashing an empty black slide.
      signVideo.onplaying = () => {
        signVideo.onplaying = null;
        if (myGen === gen) showSlide('slide-video');
      };
      signVideo.src = item.src;
      signVideo.play().catch(() => {});
    }
  }

  function startSign() {
    playSignItem(0, gen);
  }

  function stopSign() {
    showSlide(null);
    releaseVideo(welcomeVideo);
    releaseVideo(signVideo);
  }

  // ---- Clock hands ----
  function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    $('hand-hour').style.transform = `rotate(${(h + m / 60) * 30}deg)`;
    $('hand-minute').style.transform = `rotate(${(m + s / 60) * 6}deg)`;
    $('hand-second').style.transform = `rotate(${s * 6}deg)`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // =====================================================================
  // Mode switching
  // =====================================================================

  function setMode(mode) {
    if (!MODES.includes(mode)) return;
    try {
      gen++;
      clearTimer();
      if (currentMode === 'dog') stopDog();
      if (currentMode === 'sign') stopSign();
      currentMode = mode;
      console.log('[mode]', mode);
      MODES.forEach(m => $('mode-' + m).classList.toggle('active', m === mode));
      if (mode === 'dog') startDog();
      if (mode === 'sign') startSign();
    } catch (err) {
      console.error('setMode error for', mode, err);
    }
  }

  function nextMode() {
    setMode(MODES[(MODES.indexOf(currentMode) + 1) % MODES.length]);
  }

  // ---- Burn-in drift ----
  setInterval(() => {
    const dx = Math.round(randBetween(-DRIFT_PX, DRIFT_PX));
    const dy = Math.round(randBetween(-DRIFT_PX, DRIFT_PX));
    $('stage').style.transform = `translate(${dx}px, ${dy}px)`;
  }, DRIFT_EVERY_MS);

  // ---- Keyboard (bench testing without the button/sensor) ----
  // N = button press (switch mode), M = motion, D = dog mode,
  // S = sign mode, W = wake Lucy now (skips the motion checks).
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'n') nextMode();
    if (k === 'm') handleMotion();
    if (k === 'd') setMode('dog');
    if (k === 's') setMode('sign');
    if (k === 'w' && currentMode === 'dog') { gen++; wakeUp(gen); }
  });

  // ---- Button + motion sensor (gpio_control.py -> state.json) ----
  // A change in `seq` means the button was pressed; a change in
  // `motionSeq` means the sensor saw someone.
  let lastSeq = null;
  let lastMotionSeq = null;
  setInterval(() => {
    fetch('state.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        if (!data) return;
        if (typeof data.seq === 'number' && data.seq !== lastSeq) {
          const firstRun = lastSeq === null;
          lastSeq = data.seq;
          if (!firstRun) nextMode();
        }
        if (typeof data.motionSeq === 'number' && data.motionSeq !== lastMotionSeq) {
          const firstRun = lastMotionSeq === null;
          lastMotionSeq = data.motionSeq;
          if (!firstRun) handleMotion();
        }
      })
      .catch(() => {});
  }, 500);

  // Exposed for debugging from the browser console.
  window.lucy = {
    setMode, nextMode, handleMotion,
    state: () => ({ mode: currentMode, dogState, asleepSince }),
  };

  setMode(MODES[0]);
})();
</script>

</body>
</html>
